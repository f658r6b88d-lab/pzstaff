.day.sat .dw{color:var(--sat)} .day.sun .dw{color:var(--sun)}
.grp{display:flex;gap:10px;align-items:flex-start;min-width:0}
.tag{flex:none;width:30px;font-size:12px;font-weight:700;padding-top:4px}

  .tag{width:auto;padding-top:0}

.month{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}

  function navCalendar(n){

      h+='<tr class="'+t+'"><th class="sticky">'+(t==='open'?'오픈 담당':'마감 담당')+'</th>';
      dates.forEach(function(dt){var k=ymd(dt);h+='<td data-duty="'+t+'" data-date="'+k+'"'+(k===tk?' class="today"':'')+'></td>';});

    });

    document.getElementById('range').textContent=weekLabel(weekStart);

  function paintEditor(){
    var tt=document.getElementById('tt');if(!tt)return;
    var ae=document.activeElement,d=draft;
    var keys=[];for(var i=0;i<7;i++)keys.push(ymd(addDays(weekStart,i)));
    tt.querySelectorAll('input.name').forEach(function(inp){if(inp!==ae)inp.value=d.names[inp.dataset.emp];});
    tt.querySelectorAll('.cell').forEach(function(cell){
      var e=cell.dataset.emp,k=cell.dataset.date,c=cellOf(d,k,e);
      var btn=cell.querySelector('.shift'),inp=cell.querySelector('.out'),nb=cell.querySelector('.nowbtn');
      btn.textContent=LABEL[c.s];btn.dataset.s=c.s;
      btn.setAttribute('aria-label',d.names[e]+' '+k+' '+LABEL[c.s]);
      inp.disabled=!c.s;
      if(inp!==ae){
        if(c.o&&!Array.prototype.some.call(inp.options,function(op){return op.value===c.o;})){var no=document.createElement('option');no.value=c.o;no.textContent=c.o;inp.appendChild(no);}
        inp.value=c.o;
      }
      inp.classList.toggle('filled',!!c.o);
      inp.setAttribute('aria-label',d.names[e]+' '+k+' 퇴근 시간');
      nb.hidden=!(c.s&&!c.o);
    });
    EMP.forEach(function(e){
      var o=0,c=0,p2=0,w=0;
      keys.forEach(function(k){var x=cellOf(d,k,e);if(x.s){p2++;if(x.o)w++;}if(x.s==='open')o++;if(x.s==='close')c++;});
      var tr=tt.querySelector('tr[data-emp="'+e+'"]');
      tr.querySelector('.n-open').textContent=o;tr.querySelector('.n-close').textContent=c;
      tr.querySelector('.n-plan').textContent=p2;tr.querySelector('.n-work').textContent=w;
    });
    tt.querySelectorAll('td[data-duty]').forEach(function(td){
      var list=who(d,td.dataset.date,td.dataset.duty).map(function(e){return d.names[e];});
      td.textContent=list.length?list.join(', '):'미지정';
      td.classList.toggle('missing',!list.length);
    });
    paintMonth();paintHours();updateDirtyUI();
  }
  function paintMonth(){
    var mEl=document.getElementById('month');if(!mEl)return;
    var thu=addDays(weekStart,3),pre=thu.getFullYear()+'-'+pad(thu.getMonth()+1)+'-',rows='';
    EMP.forEach(function(e){
      var o=0,c=0,p2=0,w=0;
      Object.keys(draft.days).forEach(function(k){
        if(k.indexOf(pre)!==0)return;
        var x=cellOf(draft,k,e);
        if(x.s){p2++;if(x.o)w++;}if(x.s==='open')o++;if(x.s==='close')c++;
      });
      rows+='<tr><td>'+esc(draft.names[e])+'</td><td class="strong">'+w+'일</td><td>'+o+'</td><td>'+c+'</td><td>'+p2+'</td></tr>';
    });
    mEl.innerHTML='<h2>'+(thu.getMonth()+1)+'월 누계</h2><div class="scroll"><table class="mini"><thead><tr><th>직원</th><th>근무일수</th><th>오픈</th><th>마감</th><th>예정</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  function mins(t){var m=/^(\d{1,2}):(\d{2})$/.exec(typeof t==='string'?t:'');if(!m)return null;var h=+m[1],mi=+m[2];return (h>23||mi>59)?null:h*60+mi;}
  function workMins(cfg,s,o){var st=mins(cfg[s]),en=mins(o);if(st===null||en===null)return null;var diff=en-st;if(diff<0)diff+=1440;diff-=cfg.brk||0;return diff>0?diff:0;}
  function fmtHM(m){return Math.floor(m/60)+':'+pad(m%60);}
  function fmtLong(m){var h=Math.floor(m/60),r=m%60;return h+'시간'+(r?' '+r+'분':'');}
  function paintHours(){
    var el=document.getElementById('hours');if(!el)return;
    var d=draft,cfg=d.cfg,ae=document.activeElement;
    el.querySelectorAll('.cfgin').forEach(function(inp){
      if(inp===ae)return;
      var k=inp.dataset.k;inp.value=(k==='brk')?String(cfg.brk):cfg[k];
    });
    var ready=true;
    document.getElementById('hoursnote').textContent=ready
      ?'퇴근 시간 − 출근 시각(오픈 19:00, 마감 20:30) − 휴게시간으로 계산해요. 퇴근 시간이 출근 시각보다 이르면 자정을 넘긴 것으로 봅니다.'
      :'오픈·마감 출근 시각을 입력하면 퇴근 시간 기록으로 근무시간을 계산해요.';
    var dates=[];for(var i=0;i<7;i++)dates.push(addDays(weekStart,i));

    dates.forEach(function(dt){h+='<th>'+DOW[dt.getDay()]+' '+(dt.getMonth()+1)+'/'+dt.getDate()+'</th>';});
    h+='<th>주간 합계</th></tr></thead><tbody>';
    EMP.forEach(function(e){
      var tot=0,cnt=0,cells='';
      dates.forEach(function(dt){
        var c=cellOf(d,ymd(dt),e),m=(c.s&&c.o)?workMins(cfg,c.s,c.o):null;
        if(m===null)cells+='<td>'+((c.s&&c.o)?'?':'–')+'</td>';

  function updateDirtyUI(){
    var dirty=isDirty();
    var chip=document.getElementById('dirty'),pb=document.getElementById('publish'),rb=document.getElementById('revert'),dot=document.getElementById('tabdot');
    if(chip){chip.textContent=dirty?'게시 안 된 변경이 있어요':'직원 화면과 같아요';chip.classList.toggle('dirty',dirty);}
    if(pb)pb.disabled=!dirty||publishing;
    if(rb)rb.disabled=!dirty||publishing;
    if(dot)dot.hidden=!dirty;
  }
  function saveDraft(){
    if(isDirty())lsSet(DRAFT_KEY,JSON.stringify({names:draft.names,days:draft.days,cfg:draft.cfg}));else lsDel(DRAFT_KEY);
  }
  function setCell(k,e,patch){
    var cur=cellOf(draft,k,e),next={s:cur.s,o:cur.o};
    for(var key in patch)next[key]=patch[key];
    if(!next.s)next.o='';
    if(!next.s){
      if(draft.days[k]){delete draft.days[k][e];if(!Object.keys(draft.days[k]).length)delete draft.days[k];}
    }else{
      if(!draft.days[k])draft.days[k]={};
      draft.days[k][e]={s:next.s,o:next.o};
    }
    saveDraft();paintEditor();
  }
  function setPubMsg(t){var el=document.getElementById('pubmsg');if(el)el.textContent=t;}

  function resetCss(){
    var all=document.head?document.head.querySelectorAll('style'):[];
    for(var i=0;i<all.length;i++){if(/safe-area-inset/.test(all[i].textContent))return all[i].textContent;}
    return FALLBACK_RESET;
  }
  function buildDoc(d){
    var data={names:d.names,days:d.days,cfg:d.cfg,publishedAt:d.publishedAt};
    var json=JSON.stringify(data).replace(/</g,'\\u003c');
    var css=document.getElementById('css').textContent;
    var code=document.getElementById('code').textContent;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+resetCss()+'</style></head><body>'
      +HEAD_STATIC+'<style id="css">'+css+'</style>\n<div id="app"></div>\n<script id="data" type="application/json">'+json+'<\/script>\n<script id="code">'+code+'<\/script></body></html>';
  }
  function doPublish(){
    if(!artifactNS||publishing||!isDirty())return;
    publishing=true;updateDirtyUI();setPubMsg('게시하는 중…');
    draft.publishedAt=new Date().toISOString();
    saveDraft();
    var p;
    try{p=artifactNS.publish(buildDoc(draft));}catch(e){p=Promise.reject(e);}
    p.then(function(){setPubMsg('게시했어요. 화면을 새로 불러옵니다.');},function(err){
      publishing=false;draft.publishedAt=published.publishedAt;
      var c=err&&err.code,msg='게시하지 못했어요. 잠시 후 다시 눌러 주세요. 수정한 내용은 이 브라우저에 남아 있어요.';
      if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'||c==='capability_disabled'){msg='이 계정에는 게시 권한이 없어요.';canEdit=false;}
      else if(c==='conflict')msg='다른 곳에서 먼저 게시되어 최신 화면으로 다시 불러옵니다. 수정한 내용은 이 브라우저에 남아 있어요.';
      else if(c==='rate_limited')msg='너무 자주 게시했어요. 잠시 후 다시 눌러 주세요.';
      else if(c==='too_large')msg='데이터가 너무 커서 게시하지 못했어요.';
      setPubMsg(msg);updateDirtyUI();
    });
  }
  function doRevert(){
    var b=document.getElementById('revert');
    if(!revertArmed){
      revertArmed=true;if(b)b.textContent='정말 되돌릴까요?';
      clearTimeout(revertTimer);revertTimer=setTimeout(function(){revertArmed=false;var bb=document.getElementById('revert');if(bb)bb.textContent='되돌리기';},4000);
      return;
    }
    clearTimeout(revertTimer);revertArmed=false;
    draft=clone(published);lsDel(DRAFT_KEY);setPubMsg('마지막으로 게시한 상태로 되돌렸어요.');
    renderEditor();
  }

  /* ---------- events ---------- */
  app.addEventListener('click',function(ev){
    var t=ev.target.closest?ev.target.closest('button'):null;if(!t)return;
    if(t.dataset.tab){setRoute(t.dataset.tab);return;}
    if(route==='edit'&&canEdit){
      if(t.classList.contains('shift')){
        var cell=t.closest('.cell');setCell(cell.dataset.date,cell.dataset.emp,{s:NEXT[cellOf(draft,cell.dataset.date,cell.dataset.emp).s]});
      }else if(t.classList.contains('nowbtn')){
        var c2=t.closest('.cell'),n=new Date();setCell(c2.dataset.date,c2.dataset.emp,{o:(function(){var tm=(Math.round((n.getHours()*60+n.getMinutes())/15)*15)%1440;return pad(Math.floor(tm/60))+':'+pad(tm%60);})()});
      }else if(t.dataset.nav!==undefined){
        var v=+t.dataset.nav;weekStart=v===0?sundayOf(new Date()):addDays(weekStart,7*v);saveWeek();renderEditor();
      }else if(t.id==='publish')doPublish();
      else if(t.id==='revert')doRevert();
      return;
    }
    if(t.dataset.view){view=t.dataset.view;renderCalendar();}
    else if(t.dataset.nav!==undefined)navCalendar(+t.dataset.nav);
    else if(t.dataset.me){meId=(meId===t.dataset.me)?'':t.dataset.me;lsSet(ME_KEY,meId);renderCalendar();}
    else if(t.dataset.goto){
      var p3=t.dataset.goto.split('-');weekStart=sundayOf(new Date(+p3[0],+p3[1]-1,+p3[2],12));saveWeek();view='week';renderCalendar();
    }
  });
  app.addEventListener('change',function(ev){
    if(route!=='edit'||!canEdit)return;
    var t=ev.target;
    if(t.classList.contains('out')){var cell=t.closest('.cell');setCell(cell.dataset.date,cell.dataset.emp,{o:t.value||''});}
    else if(t.classList.contains('cfgin')){
      var ck=t.dataset.k;
      if(ck==='brk'){var bv=Math.round(+t.value/15)*15;draft.cfg.brk=(isFinite(bv)&&bv>=0&&bv<=600)?bv:0;}
      else draft.cfg[ck]=(mins(t.value)!==null)?t.value:'';
      saveDraft();paintEditor();
    }
    else if(t.classList.contains('name')){
      draft.names[t.dataset.emp]=t.value.trim()||DEF[t.dataset.emp];
      saveDraft();paintEditor();
    }
  });

  route=routeFromHash()==='edit'?'calendar':'calendar';
  renderShell();
